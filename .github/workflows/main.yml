name: Biblioteca-Springboot CI/CD

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - main

jobs:

  # ==========================================================
  # JOB 1 - BUILD Y TEST
  # ==========================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Descargar código del repositorio
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Configurar Java 21
      # --------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # --------------------------------------------------------
      # 3. Dar permisos al Maven Wrapper
      # --------------------------------------------------------
      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      # --------------------------------------------------------
      # 4. Compilar y ejecutar pruebas
      # --------------------------------------------------------
      - name: Build and test with Maven
        run: ./mvnw clean verify


  # ==========================================================
  # JOB 2 - DOCKER BUILD
  # ==========================================================
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build

    steps:

      # --------------------------------------------------------
      # 1. Descargar código
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Configurar Java 21
      # --------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # --------------------------------------------------------
      # 3. Permisos Maven Wrapper
      # --------------------------------------------------------
      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      # --------------------------------------------------------
      # 4. Generar los JAR
      # --------------------------------------------------------
      - name: Package applications
        run: ./mvnw clean package -DskipTests

      # --------------------------------------------------------
      # 5. Construir imágenes Docker
      # --------------------------------------------------------
      - name: Build Docker images
        run: docker compose build